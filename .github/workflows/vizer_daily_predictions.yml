# =============================================================================
# Vizer Daily Predictions — GitHub Actions
# =============================================================================
#
# Job quotidien : exécute predict_all.py --json pour NHL et NBA, puis publie
# les JSON sur la branche models-artifacts, consommée par la PWA.
#
# Arborescence publiée (branche models-artifacts) :
#   predictions/latest/nhl.json            ← toujours le dernier run
#   predictions/latest/nba.json
#   predictions/archive/YYYY-MM-DD/*.json  ← archives (écran Historique)
#   results/latest.json                    ← scores finaux, 7 derniers jours
#   results/YYYY-MM-DD.json                ← un fichier par jour (backtest)
#
# Sources au runtime :
#   - Code       : branche main
#   - Modèles    : branche models-artifacts (poussés par le training hebdo),
#                  fallback sur les modèles trackés dans main
#   - Données    : datasets Kaggle vizer-nhl-data / vizer-nba-data
#                  (téléchargement ciblé, ~85 Mo au lieu des 4,7 Go du dataset)
#   - Cotes      : The-Odds API
#
# Secrets GitHub requis :
#   KAGGLE_USERNAME, KAGGLE_KEY  → déjà utilisés par le training pipeline
#   KAGGLE_API_TOKEN             → jeton KGAT_… (cf. vizer_training_pipeline.yml).
#                                  Ce job ne fait que LIRE les datasets, ce que
#                                  l'ancienne clé permet encore — mais Kaggle a
#                                  déjà coupé les écritures, donc on passe au
#                                  jeton ici aussi plutôt que d'attendre la
#                                  prochaine coupure.
#   ODDS_API_KEY                 → clé The-Odds API (à ajouter dans
#                                  Settings > Secrets and variables > Actions)
# =============================================================================

name: Vizer Daily Predictions

on:
  schedule:
    # Tous les jours à 7h UTC : les cotes du jour sont publiées, et les
    # prédictions sont prêtes pour le café du matin (8-9h en France).
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport à prédire'
        required: false
        default: 'both'
        type: choice
        options: [both, nhl, nba]

concurrency:
  group: vizer-daily-predictions
  cancel-in-progress: false

permissions:
  contents: write   # push sur models-artifacts avec le GITHUB_TOKEN natif

jobs:
  predict-and-publish:
    name: Prédire et publier les matchs du jour
    # Runner figé : ubuntu-latest bascule sur Ubuntu 26 à partir du 19 octobre
    # 2026. Un pipeline de production ne change pas de distribution tout seul en
    # pleine saison — la montée se fera volontairement, avec un run de contrôle.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      SPORT_INPUT: ${{ github.event.inputs.sport || 'both' }}
      # Auth Kaggle CLI 2.x : env vars username+key (cf. vizer_training_pipeline.yml)
      KAGGLE_USERNAME:  ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY:       ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      ODDS_API_KEY:     ${{ secrets.ODDS_API_KEY }}
      PREDS_DIR: /tmp/preds

    steps:
      # ── 0. Garde-fous ────────────────────────────────────────────────────────
      - name: Vérifier les secrets
        run: |
          MISSING=""
          [ -z "$ODDS_API_KEY" ]    && MISSING="$MISSING ODDS_API_KEY"
          [ -z "$KAGGLE_USERNAME" ] && MISSING="$MISSING KAGGLE_USERNAME"
          [ -z "$KAGGLE_KEY" ]      && MISSING="$MISSING KAGGLE_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ Secret(s) manquant(s) :$MISSING"
            echo "   → Settings > Secrets and variables > Actions"
            exit 1
          fi

          # Ce job ne lit que des datasets, ce que l'ancienne clé permet encore :
          # on avertit sans échouer, contrairement au workflow d'entraînement qui
          # écrit et ne peut pas s'en passer.
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
            echo "✅ Secrets présents — auth Kaggle par jeton Bearer"
          else
            echo "⚠️  KAGGLE_API_TOKEN absent : lectures encore acceptées avec"
            echo "    l'ancienne clé, mais Kaggle a déjà coupé les écritures."
            echo "    Ajouter le secret avant que les lectures suivent."
          fi
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      # ── 1. Code ──────────────────────────────────────────────────────────────
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Configurer Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      # ── 2. Dépendances (chemin de prédiction uniquement, pas de notebooks) ──
      # Les versions ML viennent de requirements-runtime.txt, partagé avec le
      # notebook Kaggle : les modèles sont entraînés là-bas et chargés ici, un
      # écart de version sklearn suffit à fausser les probabilités en silence.
      - name: Installer les dépendances
        run: |
          pip install --quiet -r requirements-runtime.txt
          pip install --quiet \
            pyyaml requests python-dateutil nba_api \
            "kaggle~=2.2"
          pip install --quiet -e .
          # Versions tracées dans les logs : un écart avec celles du notebook
          # Kaggle est la première chose à regarder si les probas dérivent.
          python - <<'PYVER'
          import sklearn, xgboost, lightgbm, numpy, pandas, scipy, joblib
          print(f"sklearn={sklearn.__version__} xgboost={xgboost.__version__} "
                f"lightgbm={lightgbm.__version__} numpy={numpy.__version__} "
                f"pandas={pandas.__version__} scipy={scipy.__version__} "
                f"joblib={joblib.__version__}")
          PYVER

      # ── 3. Modèles frais (models-artifacts si dispo, sinon ceux de main) ────
      - name: Récupérer les derniers modèles entraînés
        run: |
          if git fetch origin models-artifacts 2>/dev/null; then
            git checkout origin/models-artifacts -- vizer_nhl/models 2>/dev/null \
              && echo "  ✓ modèles NHL depuis models-artifacts" \
              || echo "  ℹ️  pas de modèles NHL sur models-artifacts — fallback main"
            git checkout origin/models-artifacts -- vizer_nba/models 2>/dev/null \
              && echo "  ✓ modèles NBA depuis models-artifacts" \
              || echo "  ℹ️  pas de modèles NBA sur models-artifacts — fallback main"
          else
            echo "  ℹ️  branche models-artifacts absente — modèles de main utilisés"
          fi

      # ── 4. Données (téléchargement ciblé depuis les datasets Kaggle) ─────────
      - name: Télécharger les données NHL
        if: env.SPORT_INPUT == 'nhl' || env.SPORT_INPUT == 'both'
        run: |
          # L'agrégat porte les features ; all_teams.csv porte les scores
          # finaux. Les deux sont nécessaires : l'agrégat est en 5-contre-5,
          # donc inutilisable pour la forme récente et les confrontations
          # directes (un 3-2 réel y apparaît 0-0). Sans all_teams.csv, ces
          # deux blocs sont publiés vides, en silence.
          for f in dataset_agrege_vizer_nhl.csv all_teams.csv; do
            kaggle datasets download "$KAGGLE_USERNAME/vizer-nhl-data" \
              -f "$f" -p vizer_nhl/data --unzip --quiet
          done
          ls -lah vizer_nhl/data/

      - name: Télécharger les données NBA
        if: env.SPORT_INPUT == 'nba' || env.SPORT_INPUT == 'both'
        run: |
          for f in NBA_TEAMS.csv NBA_PLAYERS.csv NBA_ACTIVE_PLAYERS.csv \
                   NBA_GAMES.csv NBA_PLAYER_GAMES.csv; do
            kaggle datasets download "$KAGGLE_USERNAME/vizer-nba-data" \
              -f "$f" -p vizer_nba/data --unzip --quiet
          done
          ls -lah vizer_nba/data/

      # ── 5. Prédictions ───────────────────────────────────────────────────────
      # Un échec sur un sport ne bloque pas l'autre : on publie ce qui a réussi,
      # et le job est marqué en échec à la fin (step 8) si un sport a échoué.
      - name: Prédire les matchs du jour
        run: |
          mkdir -p "$PREDS_DIR"
          FAILED=""

          if [ "$SPORT_INPUT" = "nhl" ] || [ "$SPORT_INPUT" = "both" ]; then
            echo "─── NHL ───"
            ( cd vizer_nhl && python predict_all.py --json > "$PREDS_DIR/nhl.json" ) \
              && echo "  ✅ NHL OK" \
              || { echo "  ❌ NHL en échec"; FAILED="$FAILED nhl"; rm -f "$PREDS_DIR/nhl.json"; }
          fi

          if [ "$SPORT_INPUT" = "nba" ] || [ "$SPORT_INPUT" = "both" ]; then
            echo "─── NBA ───"
            ( cd vizer_nba && python predict_all.py --json > "$PREDS_DIR/nba.json" ) \
              && echo "  ✅ NBA OK" \
              || { echo "  ❌ NBA en échec"; FAILED="$FAILED nba"; rm -f "$PREDS_DIR/nba.json"; }
          fi

          echo "FAILED_SPORTS=${FAILED}" >> "$GITHUB_ENV"
          ls -lah "$PREDS_DIR"

      # ── 6. Horodatage ────────────────────────────────────────────────────────
      # La PWA affiche « Prédictions générées il y a X h » : on injecte
      # generated_at dans chaque JSON.
      - name: Injecter generated_at
        run: |
          python - <<'EOF'
          import json, pathlib
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).isoformat(timespec='seconds')
          for f in pathlib.Path("/tmp/preds").glob("*.json"):
              data = json.loads(f.read_text())
              data = {"generated_at": now, **data}
              f.write_text(json.dumps(data, ensure_ascii=False, indent=2))
              print(f"  ✓ {f.name} — generated_at={now}")
          EOF

      # ── 6 bis. Métadonnées des modèles ──────────────────────────────────────
      # L'écran Admin de la PWA lit version, date d'entraînement et métriques
      # par marché. Tout est déjà dans les registres .pkl : on ne fait que
      # l'extraire. Un échec ici ne doit pas empêcher la publication des
      # prédictions du jour.
      - name: Exporter le registre des modèles
        continue-on-error: true
        run: |
          python scripts/export_model_registry.py --out "$PREDS_DIR/registry.json" \
            && echo "  ✅ registry.json exporté" \
            || echo "  ⚠️  export du registre en échec — on publie sans"

      # ── 7. Publication sur models-artifacts ─────────────────────────────────
      # Clone séparé dans /tmp : évite tout conflit avec l'arbre de travail
      # (données téléchargées, modèles récupérés au step 3).
      - name: Publier sur la branche models-artifacts
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git clone --quiet --depth 1 --branch models-artifacts "$REPO_URL" /tmp/pub 2>/dev/null; then
            echo "  ✓ branche models-artifacts clonée"
          else
            echo "  ℹ️  branche models-artifacts absente — création"
            mkdir -p /tmp/pub
            git -C /tmp/pub init --quiet -b models-artifacts
            git -C /tmp/pub remote add origin "$REPO_URL"
          fi

          cd /tmp/pub
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "GitHub Actions [Vizer]"

          TODAY=$(date -u '+%Y-%m-%d')
          mkdir -p predictions/latest "predictions/archive/${TODAY}" models/history results

          # registry.json n'est pas une prédiction : il va dans models/.
          if ls "$PREDS_DIR"/*.json >/dev/null 2>&1; then
            for f in "$PREDS_DIR"/*.json; do
              [ "$(basename "$f")" = "registry.json" ] && continue
              cp "$f" predictions/latest/
              cp "$f" "predictions/archive/${TODAY}/"
            done
          else
            echo "ℹ️  Aucune prédiction à publier ce run."
          fi

          # Scores finaux des matchs déjà joués : c'est ce qui permet à la PWA
          # de clôturer les paris toute seule. Le script lit les fichiers déjà
          # présents dans results/ pour reconstituer sa fenêtre glissante, d'où
          # son exécution ici, après le clone. Une panne d'ESPN ne doit pas
          # faire perdre les prédictions du jour : on continue sans.
          python "$GITHUB_WORKSPACE/scripts/publish_results.py" \
            --out results --days 3 --window 7 \
            || echo "⚠️  Résultats non mis à jour (source indisponible)"

          if [ -f "$PREDS_DIR/registry.json" ]; then
            cp "$PREDS_DIR/registry.json" models/registry.json
            # Copie datée : l'Admin trace l'évolution des métriques par version.
            cp "$PREDS_DIR/registry.json" "models/history/${TODAY}.json"
          fi

          git add predictions/ models/ results/
          if git diff --cached --quiet; then
            echo "ℹ️  Aucun changement de prédictions à commiter."
            exit 0
          fi

          git commit --quiet -m "chore(data): ${TODAY} [sport: ${SPORT_INPUT}, run: #${{ github.run_number }}]"

          # Le workflow de training pousse sur la même branche. En cas de
          # collision, le push est rejeté : on rejoue sur la nouvelle tête
          # plutôt que d'échouer et de perdre les prédictions du jour.
          for attempt in 1 2 3; do
            if git push --quiet origin models-artifacts; then
              echo "✅ Publié → predictions/latest/, archive/${TODAY}/, results/"
              exit 0
            fi
            echo "  ⚠️  Push rejeté (tentative ${attempt}/3) — rebase sur origin/models-artifacts"
            git fetch --quiet --depth 50 origin models-artifacts
            git rebase --quiet FETCH_HEAD || {
              echo "  ❌ Rebase impossible"; git rebase --abort || true; exit 1
            }
            sleep 5
          done
          echo "❌ Push toujours rejeté après 3 tentatives"
          exit 1

      # ── 8. Bilan ─────────────────────────────────────────────────────────────
      - name: Bilan du run
        run: |
          echo "═══════════════════════════════════════════"
          echo "  Vizer Daily Predictions — Bilan"
          echo "  Sport demandé : ${SPORT_INPUT}"
          echo "  Publiés       : $(ls /tmp/preds 2>/dev/null || echo aucun)"
          if [ -n "${FAILED_SPORTS}" ]; then
            echo "  ❌ Échec sur :${FAILED_SPORTS}"
            exit 1
          fi
          echo "  ✅ Tout est passé"
