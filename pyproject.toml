[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vizer-core"
version = "0.2.0"
description = "Abstractions partagées pour les modèles de prédiction sportive Vizer (NBA, NHL, ...)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["vizer_core*"]

[tool.pytest.ini_options]
# Le dossier des tests est sur le chemin pour que `conftest.load()` soit
# importable depuis chaque module de test. Les modules testés, eux, sont
# chargés **par chemin** et non par import de package : `vizer_core/__init__.py`
# tire joblib, pandas, scikit-learn et xgboost, et ces tests n'en utilisent
# aucun. Le détail est dans `tests/conftest.py`.
pythonpath = [".", "tests"]
testpaths = ["tests"]
