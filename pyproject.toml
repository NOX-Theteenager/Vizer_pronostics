[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vizer-core"
version = "0.2.0"
description = "Abstractions partagées pour les modèles de prédiction sportive Vizer (NBA, NHL, ...)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["vizer_core*"]

[tool.pytest.ini_options]
# `vizer_core` n'est pas forcément installé quand les tests tournent (le job
# CI n'installe que ruff et pytest, et les dépendances ML pèsent 300 Mo pour
# des tests qui n'en ont aucun besoin). Sans cette ligne, l'import marchait
# par accident, parce que `python -m pytest` ajoute le répertoire courant au
# chemin — et cassait dès qu'on écrivait `pytest` tout court.
pythonpath = ["."]
testpaths = ["tests"]
