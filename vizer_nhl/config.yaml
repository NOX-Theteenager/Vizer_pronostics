# =============================================================================
# Vizer NHL — Configuration V5.6 → V0.1 (migration en cours)
# =============================================================================

sport: nhl
version: "0.1.0"   # Session 1 : architecture validée avec moneyline

# Chemins
paths:
  data_dir: "data"
  dataset_filename: "dataset_agrege_vizer_nhl.csv"
  models_dir: "models"
  model_filename: "nhl_model.pkl"

# Split temporel
data_split:
  exclude_anomalous_seasons: true
  excluded_years: [2013, 2020]    # lock-out + COVID bubble
  train_until_year: null   # null = auto-détection (dernière saison = test)
  test_year: null          # null = auto-détection

# Feature engineering
features:
  elo:
    k: 20.0
    home_bonus: 35.0
    base: 1500.0

# Markets activés
markets:
  moneyline:
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.25
    # Plafond de désaccord avec le consensus des bookmakers.
    #
    # Mesuré sur 51 value bets publiés (29/09 → 14/10, cf. performance/) : le
    # modèle est bien calibré dans l'ensemble — il annonce 60-70 %, il arrive
    # 62 % — mais son erreur grandit avec son désaccord. Edge < 8 % : ROI
    # −2 %. Edge > 12 % : le modèle dit 56 %, la réalité donne 31 %. Le motif
    # est monotone sur les tranches de cote comme sur celles d'edge.
    #
    # 0.12 écarte la zone où le désaccord cesse d'être une opinion pour
    # devenir un symptôme — gardien non annoncé, features périmées. Le chiffre
    # ne se valide pas sur 51 paris (±15 points d'incertitude) ; c'est une
    # borne de prudence, pas un optimum ajusté.
    max_disagreement: 0.12
    # Confiance accordée au modèle pour **dimensionner la mise**. 0.5 : à
    # preuve non faite, le prix du marché vaut autant que le modèle. Ne touche
    # pas à la sélection — un seuil d'edge sur une probabilité mélangée ne
    # retiendrait que les plus gros désaccords, ceux-là mêmes qui perdent.
    market_blend: 0.5
    hyperparameters:
      val_fraction: 0.15
      xgb:
        n_estimators: 500
        max_depth: 4
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.5
        reg_lambda: 1.5
        random_state: 42
      lgb:
        n_estimators: 500
        max_depth: 4
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42

  total:
    # Réactivé le 14/10/2026. Il était coupé sur un backtest à −11 %, mais un
    # défaut de `value_bet()` ignorait `enabled` : le marché a continué de
    # publier des paris pendant des mois. La mesure sur ces paris réels donne
    # **+11,6 % sur 28 paris** (cf. performance/), positive dans toutes les
    # tranches d'edge — à l'inverse du moneyline, qui se dégrade quand le
    # désaccord grandit. Le couper maintenant reviendrait à supprimer le seul
    # marché dont on ait une trace favorable.
    #
    # ⚠ À surveiller : **les 28 paris sont des `under`, aucun `over`.** Le
    # modèle prédit systématiquement moins de buts que le marché. Soit il
    # exploite un biais connu — les books remontent les totaux parce que le
    # public aime l'over — soit il sous-estime les buts et a eu de la chance.
    # 28 paris ne tranchent pas. C'est par là que ce marché cassera, si il
    # casse.
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.25
    default_ou_line: 5.5
    # Prudence sur la mise, comme ailleurs. Pas de plafond de désaccord ici :
    # la dégradation avec l'edge qui le justifie sur le moneyline est absente
    # de ce marché, et plafonner à 0.12 retirerait 7 paris rentables.
    market_blend: 0.5
    # hyperparams partagés via service 'poisson' (cf. ci-dessous)

  btts:
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.25
    # hyperparams partagés via service 'poisson' (cf. ci-dessous)

  p1_winner:
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.20    # plus prudent : marché 3-way
    # hyperparams partagés via service 'poisson_p1'

  p1_total:
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.25
    default_ou_line: 1.5
    # hyperparams partagés via service 'poisson_p1'

  p1_btts:
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.20    # plus prudent : low-probability + odds élevées
    # hyperparams partagés via service 'poisson_p1'

  exact_score:
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.15    # très prudent : marché à forte variance
    top_n: 10
    max_goals: 8
    # hyperparams partagés via service 'poisson'

  goal_intervals:
    enabled: true
    edge_threshold: 0.05
    kelly_factor: 0.20
    # hyperparams partagés via service 'poisson'

# Services partagés (engines entraînés une fois, consommés par plusieurs markets)
services:
  poisson:
    val_fraction: 0.15
    early_stopping: 30
    xgb:
      n_estimators: 800
      max_depth: 3
      learning_rate: 0.02
      subsample: 0.85
      colsample_bytree: 0.85
      reg_alpha: 0.3
      reg_lambda: 1.5
      random_state: 42

  poisson_p1:
    # Mode auto-détecté :
    #   - 'dedicated' si goals_p1_home/away dans dataset
    #   - 'fallback' sinon (utilise λ_total × p1_ratio_fallback)
    val_fraction: 0.15
    early_stopping: 30
    p1_ratio_fallback: 0.30   # validé empiriquement sur ~29 000 matchs NHL
    xgb:
      n_estimators: 800
      max_depth: 3
      learning_rate: 0.02
      subsample: 0.85
      colsample_bytree: 0.85
      reg_alpha: 0.3
      reg_lambda: 1.5
      random_state: 42

# Odds API (The-Odds API) — clé réutilisée du projet NHL existant
odds_api:
  key: ""   # laisser vide : lu depuis $ODDS_API_KEY (env var) ou --api-key
  sport_key: "icehockey_nhl"
  cache_ttl_minutes: 60

# -----------------------------------------------------------------------------
# Barrière de qualité — refuse le déploiement d'un modèle sous-performant
# -----------------------------------------------------------------------------
# Évaluée sur un entraînement en mode split (train.py sans --full), jamais sur
# le modèle de production dont les métriques sont in-sample.
#
# Pourquoi l'AUC et pas l'accuracy : prédire toujours « domicile » donne déjà
# 52,8 % sur le test 2026. L'AUC vaut 0,5 pour un modèle sans information.
#
# Plancher : mesure du 2026-10-13 sur le test 2026 (852 matchs) → AUC 0,608.
# 0,55 laisse de la marge : le jeu de test NHL est petit en début de saison et
# l'AUC y bouge de plusieurs centièmes d'une semaine à l'autre.
# -----------------------------------------------------------------------------
quality_gate:
  enabled: true
  min_test_games: 300        # en dessous, la mesure est trop bruitée → abstention
  markets:
    moneyline:
      min_test_auc: 0.55

    # ── Marchés de régression, gardés depuis le 14/10/2026 ───────────────
    #
    # La barrière ne surveillait que le moneyline : les sept autres marchés
    # pouvaient se dégrader indéfiniment sans que rien ne l'arrête. Ils sont
    # des régresseurs Poisson, donc jugés sur l'erreur moyenne, pas sur l'AUC.
    #
    # Ces seuils sont des **détecteurs de décrochage, pas des objectifs de
    # qualité** : ils sont posés ~20 % au-dessus de la mesure du jour, de quoi
    # laisser respirer une variation saisonnière tout en attrapant un modèle
    # qui part en vrille. Mesures du 14/10/2026, sur 852 matchs de test.
    total:
      max_test_mae: 2.25       # mesuré 1.870 buts
      # R² négatif : sur le total de buts, le modèle fait légèrement moins
      # bien que la simple moyenne. Ce n'est pas aberrant — le total de buts
      # en hockey est proche du bruit irréductible — mais ça mérite d'être
      # su, et surtout de ne pas empirer.
      min_test_r2: -0.15       # mesuré −0.052

    p1_total:
      max_test_mae: 1.20       # mesuré 0.997 but sur la 1ʳᵉ période

    btts:
      max_test_mae: 2.25       # partage le moteur Poisson du total

    goal_intervals:
      max_test_mae: 2.25

    exact_score:
      max_test_mae: 2.25
